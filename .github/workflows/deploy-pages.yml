# Build Astro site and deploy to GitHub Pages.
# One-time setup: Repo Settings > Pages > Build and deployment > Source: "GitHub Actions".

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Daily rebuild so articles with a future pubDate go live on their date.
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    # Activation permits approved-only publishing; it never approves an article.
    if: github.ref == 'refs/heads/main' && vars.DAILY_PUBLISHING_ENABLED == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python for the editorial approval gate
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Verify approval controls
        run: python scripts/test_publishing.py

      - name: Require exact article and SVG approval before building
        run: python scripts/check-publishing.py

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Astro site
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
